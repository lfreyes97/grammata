[package]
name = "typst-editor"
version = "0.1.0"
edition = "2024"

[dependencies]
eframe = { version = "0.36", features = ["default"] }
egui = "0.36"
egui_dock = { version = "0.21.1", features = ["serde"] }
egui-phosphor = "0.14.0"
hayro = "0.7.1"
rfd = "0.17.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
typst-syntax = "0.15.1"
# Compilador embebido: sin dependencia del CLI `typst`.
typst = "0.15.1"
typst-pdf = "0.15.1"
typst-svg = "0.15.1"
typst-render = "0.15.1"
tiny-skia = "0.12"
typst-kit = { version = "0.15.1", features = ["embedded-fonts", "system-files", "system-packages", "universe-packages", "scan-fonts", "datetime", "system-downloader"] }
typst-layout = "0.15.1"
# Caché de memoización de typst: se purga tras cada compilación.
comemo = "0.5.1"

# Las dependencias (hayro, vello_cpu…) se optimizan también en debug:
# sin esto el render de páginas PDF es ~20× más lento en `cargo run`.
[profile.dev.package."*"]
opt-level = 3

[dev-dependencies]
egui_kittest = { version = "0.36.2", features = ["eframe", "wgpu", "snapshot"] }
