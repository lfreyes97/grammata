name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: ubuntu-22.04
    env:
      # .cargo/config.toml fuerza clang+mold (solo para desarrollo local); en el
      # runner no hay mold, así que se anula con el linker por defecto.
      CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_LINKER: cc
      RUSTFLAGS: -C link-arg=-fuse-ld=bfd
    steps:
      - uses: actions/checkout@v4
      - name: Dependencias del sistema
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libssl-dev libfontconfig1-dev \
            libxkbcommon-dev libwayland-dev libx11-dev libxcursor-dev libxi-dev libxrandr-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      # Las pruebas de la interfaz (`--include-ignored`) necesitan GPU: no corren aquí.
      - run: cargo test --locked
      - run: cargo clippy --locked --all-targets

  windows:
    runs-on: windows-latest
    # Windows no se ha probado a mano: que compile es información, no requisito.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --locked
