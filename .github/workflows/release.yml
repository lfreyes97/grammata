name: Release

# Al subir una etiqueta `v*` compila los paquetes y los adjunta a una release.
on:
  push:
    tags: ['v*']

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: write

jobs:
  linux:
    # Ubuntu 22.04: la glibc más antigua que soportamos.
    runs-on: ubuntu-22.04
    env:
      # .cargo/config.toml fuerza clang+mold (solo para desarrollo local); en el
      # runner no hay mold, así que se anula con el linker por defecto.
      CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_LINKER: cc
      RUSTFLAGS: -C link-arg=-fuse-ld=bfd
    steps:
      - uses: actions/checkout@v4
      - name: La etiqueta coincide con Cargo.toml
        run: |
          ver="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)"
          [ "v$ver" = "$GITHUB_REF_NAME" ] || { echo "etiqueta $GITHUB_REF_NAME, Cargo.toml $ver" >&2; exit 1; }
      - name: Dependencias del sistema
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libssl-dev libfontconfig1-dev \
            libxkbcommon-dev libwayland-dev libx11-dev libxcursor-dev libxi-dev libxrandr-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: tar.gz
        run: packaging/build-linux.sh
      - name: .deb
        run: SKIP_BUILD=1 packaging/build-deb.sh
      - name: AppImage
        run: |
          url=https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          curl -fsSL -o "$RUNNER_TEMP/appimagetool.AppImage" "$url"
          chmod +x "$RUNNER_TEMP/appimagetool.AppImage"
          # Sin FUSE en el runner: se ejecuta extrayéndose.
          printf '#!/bin/sh\nexec "%s" --appimage-extract-and-run "$@"\n' "$RUNNER_TEMP/appimagetool.AppImage" > "$RUNNER_TEMP/appimagetool"
          chmod +x "$RUNNER_TEMP/appimagetool"
          SKIP_BUILD=1 APPIMAGETOOL="$RUNNER_TEMP/appimagetool" packaging/build-appimage.sh
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: |
            dist/*.tar.gz
            dist/*.deb
            dist/*.AppImage
            dist/*.sha256

  windows:
    runs-on: windows-latest
    # Sin pruebas manuales: si falla, la release sale sin el .zip.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --locked
      - name: zip
        shell: pwsh
        run: |
          $name = "grammata-$($env:GITHUB_REF_NAME.TrimStart('v'))-windows-x86_64"
          New-Item -ItemType Directory dist/$name | Out-Null
          Copy-Item target/release/grammata.exe, LICENSE dist/$name
          Compress-Archive dist/$name "dist/$name.zip"
          (Get-FileHash "dist/$name.zip" -Algorithm SHA256).Hash.ToLower() + "  $name.zip" | Set-Content "dist/$name.zip.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            dist/*.zip
            dist/*.sha256

  release:
    needs: [linux, windows]
    # Aunque Windows falle, se publica lo de Linux.
    if: ${{ !cancelled() && needs.linux.result == 'success' }}
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artefactos
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: artefactos/*
          generate_release_notes: true
          body: |
            ## Grammata 0.1.0

            Primera versión pública de Grammata: un editor de escritorio nativo para [Typst](https://typst.app), escrito en Rust con egui. El nombre viene del griego γράμματα, «letras».

            ### Qué incluye
            - Vista previa en vivo del **PDF real**, con el compilador de Typst embebido (no hace falta el CLI).
            - Pestañas y paneles acoplables: esquema, símbolos, snippets, plantillas, archivos, borrador y problemas.
            - Editor con resaltado del analizador oficial de Typst y autocompletado.
            - Plugins declarativos y programas externos, como Pandoc para importar y exportar Markdown. Los programas externos solo corren si los permites.

            ### Descargas
            - **Linux:** `.tar.gz` (dentro, `./install.sh [PREFIX]`), `.deb` y AppImage.
            - **Windows:** `.zip` con `grammata.exe`.

            ### Estado por plataforma
            - **Linux:** es la plataforma probada.
            - **Windows:** se compila en CI, sin pruebas manuales.
            - **macOS:** no se ha probado y no se ofrece paquete.

            ### Limitaciones conocidas
            - Los argumentos de línea de comandos se ignoran: abrir un archivo desde el lanzador todavía no funciona.
            - El paquete no incluye aún el fichero de licencias de terceros.

            Licencia: GPL-3.0-or-later. «Typst» es marca de Typst GmbH; este proyecto es independiente y no está afiliado a ella.
